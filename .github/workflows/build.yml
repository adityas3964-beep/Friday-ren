name: Build JARVIS debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**/app/**'
      - 'app/**'
      - '**/build.gradle.kts'
      - '**/settings.gradle.kts'
      - '**/gradle.properties'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate project folder
        run: |
          f=$(find . -maxdepth 3 -name settings.gradle.kts -not -path './.git/*' | head -n 1)
          if [ -z "$f" ]; then
            echo "::error::settings.gradle.kts not found anywhere in the repository. Upload the extracted ZIP contents."
            ls -la
            exit 1
          fi
          dir=$(dirname "$f")
          echo "Project folder: $dir"
          for g in build.gradle.kts app/build.gradle.kts app/src/main/AndroidManifest.xml; do
            test -f "$dir/$g" || { echo "::error::Missing $dir/$g"; exit 1; }
          done
          echo "PROJECT_DIR=$dir" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Unit tests and debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
